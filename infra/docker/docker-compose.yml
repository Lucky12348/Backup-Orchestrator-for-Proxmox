services:
  api:
    container_name: proxmox-backup-orchestrator-api
    build:
      # Repository root: the image also builds and serves the web UI.
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    # Only bootstrap values here. Proxmox/PBS/agents/ntfy settings live in the
    # database (setup wizard); a legacy .env is imported once via env_file.
    environment:
      API_PORT: ${API_PORT:-8000}
      APP_MAINTENANCE_AGENT_BASE_URL: ${APP_MAINTENANCE_AGENT_BASE_URL:-http://host.docker.internal:8092}
      MAINTENANCE_TIMEOUT_SECONDS: ${MAINTENANCE_TIMEOUT_SECONDS:-300}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/proxmox_backup_orchestrator}
      PLANNING_SCHEDULER_ENABLED: ${PLANNING_SCHEDULER_ENABLED:-true}
      PLANNING_SCHEDULER_INTERVAL_SECONDS: ${PLANNING_SCHEDULER_INTERVAL_SECONDS:-60}
    ports:
      # Web UI + API on the same port (no separate web container anymore).
      - "${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: proxmox-backup-orchestrator-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proxmox_backup_orchestrator}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No weak fallback: fail loudly at `docker compose up` instead of silently
      # starting with a well-known default password reachable from the LAN.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-proxmox_backup_orchestrator}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      # Bound to loopback only: the api/web containers reach Postgres over the
      # internal compose network via the `db` hostname, they don't need this
      # published port. This is only for local admin access (psql, GUI clients)
      # from the app VM itself.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
