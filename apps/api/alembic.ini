# Alembic CLI configuration (developer use: `alembic revision`, `alembic history`).
# The API applies migrations itself at startup (app/db/migrate.py).
# The database URL comes from DATABASE_URL (see app/db/migrations/env.py).

[alembic]
script_location = app/db/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
