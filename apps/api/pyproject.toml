[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxmox-backup-orchestrator-api"
version = "0.1.0"
description = "FastAPI backend for proxmox_backup_orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2.0",
  # Notifications (Phase 5j): one engine for ntfy, Gotify, Discord, Telegram,
  # SMTP, webhooks and any Apprise URL. BSD-2-Clause. Pinned: channel URLs are
  # built for this version's syntax (services/notification_channels.py).
  "apprise==2.1.0",
  "bcrypt>=4.0.1,<5",
  "cryptography>=42",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "passlib[bcrypt]>=1.7.4",
  # Disk photos: decoded, resized and re-encoded server-side (Phase 5f).
  "Pillow>=10.4",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "uvicorn[standard]>=0.30,<1.0",
  # IANA zones for zoneinfo where the OS has no tz database (Windows dev, slim images).
  "tzdata>=2024.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"app.db.migrations" = ["script.py.mako"]
"app.agent_install" = ["install.sh"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
