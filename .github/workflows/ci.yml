name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.component }} (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Debian 12 (bookworm), 3.13 = Debian 13 (trixie): the two targets
        # of the future native LXC / agent install.
        python: ["3.11", "3.13"]
        component: [api, agent, app-maintenance-agent]
    defaults:
      run:
        working-directory: apps/${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest httpx "ruff==0.17.5"

      # Blocking gate: syntax errors and undefined names only.
      # The default ruff rule set (E4,E7,E9,F) currently reports a few unused
      # imports in business code (see docs/PUBLIC_RELEASE_AUDIT.md); it is
      # shown below without failing the build until that cleanup lands.
      - name: Lint (blocking)
        run: ruff check --isolated --select E9,F63,F7,F82 .

      - name: Lint (report only)
        run: ruff check --isolated --select E4,E7,E9,F --exit-zero --output-format github .

      - name: Tests
        run: python -m pytest -q

  web:
    name: web (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node >= 22.18 runs the .ts test files natively (type stripping).
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # A lock generated without resolved/integrity or without the Linux
      # esbuild/rollup binaries breaks npm ci + vite build on Linux.
      - name: Check lockfile
        run: node ../../scripts/ci/check-lockfile.mjs package-lock.json

      - name: Install
        run: npm ci

      - name: Build (tsc --noEmit + vite build)
        run: npm run build

      - name: Tests
        run: npm test

  shellcheck:
    name: shell scripts (shellcheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck is preinstalled on ubuntu-latest. Every tracked *.sh plus the
      # agent installer served by the app; -x follows the sourced helper files.
      - name: shellcheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck -x -P SCRIPTDIR

      - name: Agent installer tests (bash)
        run: bash scripts/ci/test-agent-install.sh

  docker:
    name: docker image (api + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f infra/docker/api.Dockerfile -t pbo-api:ci .
